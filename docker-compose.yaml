services:
  saturn:
    platform: linux/amd64
    image: ghcr.io/midianok/saturn:latest
    build:
      context: .
      dockerfile: ./Saturn.Telegram.Bot/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    env_file:
      - ./.env
    labels:
      dozzle.enable: "true"
    depends_on:
      db:
        condition: service_healthy

  saturn-api:
    platform: linux/amd64
    image: ghcr.io/midianok/saturn-api:latest
    build:
      context: .
      dockerfile: ./Saturn.Telegram.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    labels:
      dozzle.enable: "true"
    networks:
      - default
      - proxy_net

  dozzle:
    image: amir20/dozzle:latest
    restart: always
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_FILTER: label=dozzle.enable=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle:/data
    ports:
      - "9090:8080"

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
    
networks:
  proxy_net:
    external: true 
    