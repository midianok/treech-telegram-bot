services:
  saturn:
    platform: linux/amd64
    image: ghcr.io/midianok/saturn:latest
    build:
      context: .
      dockerfile: ./Saturn.Telegram.Bot/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    env_file:
      - ./.env
    volumes:
      - ./youtube_cookies.txt:/app/youtube_cookies.txt
      - ./instagram_cookies.txt:/app/instagram_cookies.txt
    depends_on:
      db:
        condition: service_healthy

  saturn-api:
    platform: linux/amd64
    image: ghcr.io/midianok/saturn-api:latest
    build:
      context: .
      dockerfile: ./Saturn.Telegram.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy_net
  
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
    
networks:
  proxy_net:
    external: true 
    