<style>
body{margin:0;padding:0}
#c{display:block;width:100%;height:160px;touch-action:none}
#b{padding:2px 14px max(8px,env(safe-area-inset-bottom));font-size:13px;color:var(--tg-theme-hint-color)}
</style>
<canvas id="c"></canvas>
<div id="b">Тап — прыжок, удерживай — выше</div>
<script>
const TW=window.TelegramWidget,c=document.getElementById('c'),x=c.getContext('2d'),H=160,G=132,PX=40;
let W=320,C={},best=0,st=0,sp,sc,y,vy,ob,cl,gx,lt,nx,jb,rec,t0=0,run=0;
try{best=+localStorage.getItem('best')||0}catch(e){}
const hap=(k,v)=>{try{TW.HapticFeedback[k](v)}catch(e){}};
const pad=n=>String(n|0).padStart(5,'0');
function theme(){const p=(TW&&TW.themeParams)||{},s=getComputedStyle(document.documentElement),g=(k,d)=>p[k]||s.getPropertyValue('--tg-theme-'+k.replace(/_/g,'-')).trim()||d;C={f:g('text_color','#222'),h:g('hint_color','#999'),a:g('button_color','#2aabee'),s:g('secondary_bg_color','#e8e8e8'),b:g('bg_color','#fff')}}
function size(){W=c.clientWidth||320;const d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);if(st!==1)draw()}
function reset(){sp=330;sc=0;y=0;vy=0;ob=[];gx=0;nx=W*.7;jb=0;rec=0;cl=[[W*.25,28],[W*.75,52]]}
function spawn(){const bird=sc>200&&Math.random()<.3;ob.push(bird?{x:W+10,w:26,h:14,b:Math.random()<.5?6:32,k:1}:{x:W+10,w:10+Math.random()*16|0,h:20+Math.random()*22|0,b:0,k:0});nx=sp*(.6+Math.random()*.7)+100}
function jump(){vy=720;jb=0;hap('impactOccurred','light')}
function die(){st=2;t0=Date.now();if(sc>best){best=sc|0;rec=1;try{localStorage.setItem('best',best)}catch(e){}hap('notificationOccurred','success')}else hap('notificationOccurred','error')}
function step(dt){
sp=Math.min(sp+7*dt,720);sc+=dt*sp/30;gx+=sp*dt;
vy-=2600*dt;y+=vy*dt;if(y<=0){y=0;vy=0;if(jb>0)jump()}jb-=dt;
for(const k of cl){k[0]-=sp*.12*dt;if(k[0]<-60)k[0]=W+Math.random()*80}
nx-=sp*dt;if(nx<=0)spawn();
for(const o of ob){o.x-=sp*dt;if(PX+4<o.x+o.w-2&&PX+18>o.x+2&&y+2<o.b+o.h-2&&y+21>o.b+2)return die()}
if(ob.length&&ob[0].x<-40)ob.shift()}
function draw(){
x.clearRect(0,0,W,H);x.fillStyle=C.s;
for(const[a,b]of cl){x.beginPath();x.roundRect(a,b,46,12,6);x.roundRect(a+12,b-7,22,14,7);x.fill()}
x.fillStyle=C.h;x.fillRect(0,G,W,1);
for(let i=0;i<14;i++)x.fillRect(((i*89-gx)%W+W)%W,G+5+i%3*6,2+i%4,1.5);
x.fillStyle=C.f;
for(const o of ob){const t=G-o.b-o.h;if(o.k){const f=(gx/24|0)%2;x.beginPath();x.moveTo(o.x+4,t+6);x.lineTo(o.x+22,t+6);x.lineTo(o.x+13,f?t-5:t+15);x.fill();x.beginPath();x.roundRect(o.x,t+3,26,8,4);x.fill()}
else{x.beginPath();x.roundRect(o.x+o.w*.3,t,o.w*.4,o.h,3);x.fill();x.fillRect(o.x,t+o.h*.45,o.w,3);x.fillRect(o.x,t+o.h*.2,3,o.h*.28);x.fillRect(o.x+o.w-3,t+o.h*.3,3,o.h*.18)}}
const by=G-y-24;x.fillStyle=C.a;x.beginPath();x.roundRect(PX,by,22,22,8);x.fill();
x.fillRect(PX+10,by-5,2,5);x.beginPath();x.arc(PX+11,by-6,2.5,0,7);x.fill();
const f=y===0&&st===1&&(gx/14|0)%2;x.fillRect(PX+4,by+22,4,f?1:2);x.fillRect(PX+14,by+22,4,f?2:1);
x.fillStyle=C.b;x.beginPath();x.arc(PX+15,by+8,4.5,0,7);x.fill();
x.fillStyle=C.f;if(st===2){x.fillRect(PX+12,by+7,6,2)}else{x.beginPath();x.arc(PX+16,by+8,2.2,0,7);x.fill()}
x.textAlign='right';x.font='600 14px ui-monospace,monospace';x.fillText(pad(sc),W-14,22);
x.fillStyle=C.h;x.fillText('HI '+pad(best),W-70,22);
if(st!==1){x.textAlign='center';x.fillStyle=C.f;x.font='600 16px system-ui,sans-serif';
x.fillText(st===0?'Тап — старт':st===3?'Пауза · тап — продолжить':rec?'Новый рекорд!':'Игра окончена',W/2,76);
if(st===2){x.fillStyle=C.h;x.font='14px system-ui,sans-serif';x.fillText('тап — заново',W/2,98)}}}
function loop(t,id){if(st!==1||id!==run)return;if(lt==null)lt=t;step(Math.min((t-lt)/1000,.05));lt=t;draw();if(st===1)requestAnimationFrame(t=>loop(t,id))}
function go(){st=1;lt=null;const id=++run;requestAnimationFrame(t=>loop(t,id))}
c.addEventListener('pointerdown',()=>{if(st===1){if(y===0)jump();else jb=.12}});
const up=()=>{if(vy>260)vy=260};
c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
c.addEventListener('click',()=>{if(st===0||st===3)go();else if(st===2&&Date.now()-t0>400){reset();go()}});
if(TW){TW.onEvent('themeChanged',()=>{theme();draw()});TW.onEvent('deactivated',()=>{if(st===1){st=3;draw()}})}
theme();reset();size();
if(window.ResizeObserver)new ResizeObserver(size).observe(c);
TW&&TW.ready();
</script>
